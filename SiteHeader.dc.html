<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #F5EFE5; color: #2D2523; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: #5D2B2A; text-decoration: none; }
  a:hover { color: #D1A859; }
  ::selection { background: #D1A859; color: #3F2423; }
  .wa-tab .wa-hint { position: absolute; right: calc(100% + 12px); top: 50%; transform: translate(8px, -50%); writing-mode: horizontal-tb; white-space: nowrap; background: #128C4A; color: #FFFFFF; border: 1px solid #25D366; padding: 10px 16px; font-size: 13px; font-weight: 500; letter-spacing: .04em; box-shadow: 0 8px 22px rgba(0,0,0,.24); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; }
  .wa-tab .wa-hint::after { content: ""; position: absolute; left: 100%; top: 50%; transform: translateY(-50%); border: 6px solid transparent; border-left-color: #128C4A; }
  .wa-tab:hover .wa-hint, .wa-tab:focus-visible .wa-hint { opacity: 1; transform: translate(0, -50%); }
  html, body { max-width: 100%; overflow-x: clip; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  img, svg, video, iframe { max-width: 100%; }
  h1, h2, h3, h4, p, blockquote, a, span { overflow-wrap: break-word; }
  input, textarea, select, button { font: inherit; max-width: 100%; }
  a, button { -webkit-tap-highlight-color: transparent; }
  @media (hover: none) { .wa-tab .wa-hint { display: none; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
</helmet>

<header style="position:fixed;left:0;right:0;top:0;z-index:70;background:#3F2423;border-bottom:1px solid rgba(209,168,89,.32)">
  <div style="max-width:1340px;margin:0 auto;padding:0 clamp(16px,3vw,40px);height:{{ barH }};display:flex;align-items:center;justify-content:space-between;gap:20px">
    <a href="index.html" aria-label="Riyasat e Resort home" style="display:flex;align-items:center;height:100%;flex:0 0 auto">
      <img src="assets/circular%20logo.png" alt="Riyasat e Resort" style="width:{{ logoH }};height:{{ logoH }};border-radius:50%;display:block;flex:0 0 auto" />
    </a>
    <nav style="display:{{ navRowDisplay }};align-items:center;gap:clamp(16px,2.2vw,30px)">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
        <a href="{{ l.href }}" style="font-size:13px;font-weight:500;letter-spacing:.06em;color:{{ l.color }};padding:6px 0;border-bottom:1px solid {{ l.rule }};white-space:nowrap;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="color:#D1A859">{{ l.label }}</a>
      </sc-for>
    </nav>
    <a href="{{ waHref }}" style="display:{{ navRowDisplay }};align-items:center;gap:9px;background:#128C4A;color:#FFFFFF;font-size:12.5px;font-weight:600;letter-spacing:.04em;padding:12px 18px;white-space:nowrap;flex:0 0 auto;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:#0E7A3F"><svg viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:-4px;margin-right:9px;flex:0 0 auto" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.9-.94 1.08-.17.18-.35.2-.65.07-.3-.15-1.13-.42-2.15-1.33-.79-.71-1.32-1.58-1.48-1.88-.15-.3-.02-.47.13-.62.15-.15.35-.42.52-.63.17-.2.22-.35.33-.58.1-.22.05-.42-.03-.6-.07-.17-.67-1.63-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.03 1-1.03 2.43 0 1.43 1.05 2.81 1.2 3 .15.2 2.06 3.28 5.02 4.47 2.96 1.18 2.96.79 3.5.74.53-.05 1.73-.7 1.98-1.38.25-.68.25-1.26.17-1.38-.07-.12-.27-.2-.57-.35zM12.04 21.5h-.01c-1.72 0-3.4-.46-4.88-1.34l-.35-.2-3.63.95.97-3.54-.23-.37a9.4 9.4 0 01-1.44-5.02c0-5.2 4.24-9.44 9.46-9.44 2.53 0 4.9.99 6.68 2.77a9.36 9.36 0 012.77 6.68c0 5.2-4.25 9.43-9.46 9.43zm8.04-17.48A11.36 11.36 0 0012.04.5C5.78.5.7 5.58.7 11.83c0 2 .52 3.95 1.52 5.67L.5 23.5l6.15-1.61a11.34 11.34 0 005.39 1.37h.01c6.25 0 11.34-5.08 11.34-11.33 0-3.03-1.18-5.88-3.31-8.01z"/></svg>{{ phone }}</a>
    <button onClick="{{ toggleNav }}" aria-label="Open menu" aria-expanded="{{ navOpen }}" style="display:{{ burgerDisplay }};width:46px;height:42px;background:transparent;border:1px solid rgba(209,168,89,.5);flex-direction:column;justify-content:center;gap:6px;align-items:center;cursor:pointer;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:rgba(209,168,89,.16);border-color:#D1A859">
      <span style="width:20px;height:1.5px;background:#D1A859"></span>
      <span style="width:20px;height:1.5px;background:#D1A859"></span>
      <span style="width:20px;height:1.5px;background:#D1A859"></span>
    </button>
  </div>
</header>

<sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:80;background:#3F2423;padding:calc({{ barH }} + 16px) clamp(20px,5vw,48px) calc(26px + env(safe-area-inset-bottom));animation:riseIn .26s ease both;overflow-y:auto;-webkit-overflow-scrolling:touch">
    <a href="index.html" aria-label="Riyasat e Resort home" style="position:absolute;top:0;left:clamp(16px,3vw,40px);height:{{ barH }};display:flex;align-items:center"><img src="assets/circular%20logo.png" alt="Riyasat e Resort" style="width:{{ logoH }};height:{{ logoH }};border-radius:50%;display:block" /></a>
    <button onClick="{{ closeNav }}" aria-label="Close menu" style="position:absolute;top:calc(({{ barH }} - 42px) / 2);right:clamp(16px,3vw,40px);width:46px;height:42px;background:transparent;border:1px solid rgba(209,168,89,.5);color:#D1A859;font-size:18px;line-height:1;cursor:pointer;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:rgba(209,168,89,.16);border-color:#D1A859">×</button>
    <div style="display:flex;flex-direction:column;gap:2px;max-width:560px;margin:0 auto">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="7">
        <a href="{{ l.href }}" onClick="{{ closeNav }}" style="font-family:'Playfair Display',serif;font-size:clamp(22px,6vw,30px);color:{{ l.menuColor }};padding:clamp(10px,2.2vh,15px) 0;border-bottom:1px solid rgba(209,168,89,.2);transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="color:#D1A859">{{ l.label }}</a>
      </sc-for>
    </div>
    <a href="{{ waHref }}" style="display:block;max-width:560px;margin:28px auto 0;text-align:center;background:#128C4A;color:#FFFFFF;font-weight:600;font-size:14px;padding:17px;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:#0E7A3F"><svg viewBox="0 0 24 24" style="width:18px;height:18px;vertical-align:-4px;margin-right:9px;flex:0 0 auto" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.9-.94 1.08-.17.18-.35.2-.65.07-.3-.15-1.13-.42-2.15-1.33-.79-.71-1.32-1.58-1.48-1.88-.15-.3-.02-.47.13-.62.15-.15.35-.42.52-.63.17-.2.22-.35.33-.58.1-.22.05-.42-.03-.6-.07-.17-.67-1.63-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.03 1-1.03 2.43 0 1.43 1.05 2.81 1.2 3 .15.2 2.06 3.28 5.02 4.47 2.96 1.18 2.96.79 3.5.74.53-.05 1.73-.7 1.98-1.38.25-.68.25-1.26.17-1.38-.07-.12-.27-.2-.57-.35zM12.04 21.5h-.01c-1.72 0-3.4-.46-4.88-1.34l-.35-.2-3.63.95.97-3.54-.23-.37a9.4 9.4 0 01-1.44-5.02c0-5.2 4.24-9.44 9.46-9.44 2.53 0 4.9.99 6.68 2.77a9.36 9.36 0 012.77 6.68c0 5.2-4.25 9.43-9.46 9.43zm8.04-17.48A11.36 11.36 0 0012.04.5C5.78.5.7 5.58.7 11.83c0 2 .52 3.95 1.52 5.67L.5 23.5l6.15-1.61a11.34 11.34 0 005.39 1.37h.01c6.25 0 11.34-5.08 11.34-11.33 0-3.03-1.18-5.88-3.31-8.01z"/></svg>{{ phone }}</a>
  </div>
</sc-if>

<a href="{{ waHref }}" class="wa-tab" aria-label="Chat with us on WhatsApp, {{ phone }}" style="position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:65;display:{{ waTabDisplay }};align-items:center;gap:10px;writing-mode:vertical-rl;background:#128C4A;border:1px solid #25D366;border-right:none;color:#FFFFFF;padding:22px 12px;font-size:12px;font-weight:500;letter-spacing:.14em;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:#0E7A3F">
  <svg viewBox="0 0 24 24" style="width:18px;height:18px;margin:0 0 9px;flex:0 0 auto" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.9-.94 1.08-.17.18-.35.2-.65.07-.3-.15-1.13-.42-2.15-1.33-.79-.71-1.32-1.58-1.48-1.88-.15-.3-.02-.47.13-.62.15-.15.35-.42.52-.63.17-.2.22-.35.33-.58.1-.22.05-.42-.03-.6-.07-.17-.67-1.63-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.03 1-1.03 2.43 0 1.43 1.05 2.81 1.2 3 .15.2 2.06 3.28 5.02 4.47 2.96 1.18 2.96.79 3.5.74.53-.05 1.73-.7 1.98-1.38.25-.68.25-1.26.17-1.38-.07-.12-.27-.2-.57-.35zM12.04 21.5h-.01c-1.72 0-3.4-.46-4.88-1.34l-.35-.2-3.63.95.97-3.54-.23-.37a9.4 9.4 0 01-1.44-5.02c0-5.2 4.24-9.44 9.46-9.44 2.53 0 4.9.99 6.68 2.77a9.36 9.36 0 012.77 6.68c0 5.2-4.25 9.43-9.46 9.43zm8.04-17.48A11.36 11.36 0 0012.04.5C5.78.5.7 5.58.7 11.83c0 2 .52 3.95 1.52 5.67L.5 23.5l6.15-1.61a11.34 11.34 0 005.39 1.37h.01c6.25 0 11.34-5.08 11.34-11.33 0-3.03-1.18-5.88-3.31-8.01z"/></svg>{{ phone }}
  <span class="wa-hint" aria-hidden="true">Chat with us</span>
</a>

<a href="{{ waHref }}" aria-label="Chat on WhatsApp" style="position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:65;display:{{ waBarDisplay }};align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#128C4A;color:#FFFFFF;box-shadow:0 8px 22px rgba(0,0,0,.28);transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:#0E7A3F">
  <svg viewBox="0 0 24 24" style="width:28px;height:28px;flex:0 0 auto" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.9-.94 1.08-.17.18-.35.2-.65.07-.3-.15-1.13-.42-2.15-1.33-.79-.71-1.32-1.58-1.48-1.88-.15-.3-.02-.47.13-.62.15-.15.35-.42.52-.63.17-.2.22-.35.33-.58.1-.22.05-.42-.03-.6-.07-.17-.67-1.63-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.03 1-1.03 2.43 0 1.43 1.05 2.81 1.2 3 .15.2 2.06 3.28 5.02 4.47 2.96 1.18 2.96.79 3.5.74.53-.05 1.73-.7 1.98-1.38.25-.68.25-1.26.17-1.38-.07-.12-.27-.2-.57-.35zM12.04 21.5h-.01c-1.72 0-3.4-.46-4.88-1.34l-.35-.2-3.63.95.97-3.54-.23-.37a9.4 9.4 0 01-1.44-5.02c0-5.2 4.24-9.44 9.46-9.44 2.53 0 4.9.99 6.68 2.77a9.36 9.36 0 012.77 6.68c0 5.2-4.25 9.43-9.46 9.43zm8.04-17.48A11.36 11.36 0 0012.04.5C5.78.5.7 5.58.7 11.83c0 2 .52 3.95 1.52 5.67L.5 23.5l6.15-1.61a11.34 11.34 0 005.39 1.37h.01c6.25 0 11.34-5.08 11.34-11.33 0-3.03-1.18-5.88-3.31-8.01z"/></svg>
</a>

<button onClick="{{ scrollToTop }}" aria-label="Back to top" style="position:fixed;right:{{ topBtnRight }};bottom:{{ topBtnBottom }};z-index:65;display:{{ topBtnDisplay }};align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:#3F2423;border:1px solid rgba(209,168,89,.6);color:#D1A859;box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer;transition:background-color .25s ease,color .25s ease,border-color .25s ease" style-hover="background:#5D2B2A;border-color:#D1A859">
  <svg viewBox="0 0 24 24" style="width:22px;height:22px;flex:0 0 auto" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;rooms&quot;,&quot;events&quot;,&quot;properties&quot;,&quot;gallery&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8700616225&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = {
    isMobile: typeof window !== 'undefined' && window.innerWidth < 980,
    isNarrow: typeof window !== 'undefined' && window.innerWidth < 1220,
    isCompact: typeof window !== 'undefined' && window.innerWidth < 1100,
    navOpen: false,
    showTop: false,
  };

  navLinks = [
    { href: 'index.html', label: 'Home', key: 'home' },
    { href: 'About.dc.html', label: 'About', key: 'about' },
    { href: 'Rooms.dc.html', label: 'Rooms', key: 'rooms' },
    { href: 'Events.dc.html', label: 'Events', key: 'events' },
    { href: 'Properties.dc.html', label: 'Properties', key: 'properties' },
    { href: 'Gallery.dc.html', label: 'Gallery', key: 'gallery' },
    { href: 'Contact.dc.html', label: 'Contact', key: 'contact' },
  ];

  componentDidMount() {
    this.onResize = () => this.setState({ isMobile: window.innerWidth < 980, isNarrow: window.innerWidth < 1220, isCompact: window.innerWidth < 1100 });
      if (window.innerWidth >= 1100 && this.state.navOpen) this.closeMenu();
    this.onScroll = () => {
      const show = window.scrollY > 500;
      if (show !== this.state.showTop) this.setState({ showTop: show });
    };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
  }

  openMenu() {
    document.body.style.overflow = 'hidden';
    this.setState({ navOpen: true });
  }

  closeMenu() {
    document.body.style.overflow = '';
    this.setState({ navOpen: false });
  }

  componentWillUnmount() {
    document.body.style.overflow = '';
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
  }

  renderVals() {
    const m = this.state.isMobile;
    const c = this.state.isCompact;
    const phone = this.props.phone ?? '8700616225';
    const active = this.props.active ?? 'home';
    return {
      phone,
      waHref: 'https://wa.me/91' + String(phone).replace(/\D/g, ''),
      barH: m ? '64px' : '80px',
      logoH: m ? '64px' : '80px',
      navRowDisplay: c ? 'none' : 'flex',
      burgerDisplay: c ? 'flex' : 'none',
      waTabDisplay: m ? 'none' : 'flex',
      waBarDisplay: m ? 'flex' : 'none',
      links: this.navLinks.map(l => ({
        ...l,
        color: l.key === active ? '#D1A859' : 'rgba(245,239,229,.86)',
        rule: l.key === active ? '#D1A859' : 'transparent',
        menuColor: l.key === active ? '#D1A859' : '#F5EFE5',
      })),
      navOpen: this.state.navOpen,
      toggleNav: () => (this.state.navOpen ? this.closeMenu() : this.openMenu()),
      closeNav: () => this.closeMenu(),
      topBtnDisplay: this.state.showTop ? 'flex' : 'none',
      topBtnRight: m ? '20px' : '24px',
      topBtnBottom: m ? 'calc(86px + env(safe-area-inset-bottom))' : '24px',
      scrollToTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
    };
  }
}
</script>
</body>
</html>
